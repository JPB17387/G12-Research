<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Determinants of Smartphone Addiction on the Academic Performance of Students — A G12 CSS Research Study at Dumanjug National High School.">
  <title>Smartphone Addiction Study — G12 Research</title>
  <meta http-equiv="refresh" content="0; url=html/homepage.html">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      font-family: 'Inter', system-ui, sans-serif;
      color: #e0e0e0;
    }
    .loading {
      text-align: center;
      animation: fadeIn 0.6s ease;
    }
    .loading p {
      font-size: 1.1rem;
      opacity: 0.7;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(108, 99, 255, 0.2);
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>Loading Research Study&hellip;</p>
  </div>
  <script>
    // Fallback redirect in case meta refresh doesn't work
    window.location.href = 'html/homepage.html';
  </script>
</body>
</html>
